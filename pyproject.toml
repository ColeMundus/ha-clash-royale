[project]
name = "ha-clash-royale"
version = "0.1.0"
description = "Clash Royale War Tracker integration for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.11.0",
  "pytest-homeassistant==2026.11.0",
  "pytest-cov==7.1.0",
  "pillow==13.0.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p pytest_homeassistant -q --strict-markers"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
